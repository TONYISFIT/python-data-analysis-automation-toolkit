[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-toolkit"
version = "0.1.0"
description = "Automate data validation and reporting: schema checks, profiling, Markdown reports, CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vishwaraj Algude" }]
keywords = ["data-quality", "validation", "pandas", "reporting", "automation"]
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
data-toolkit = "data_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
